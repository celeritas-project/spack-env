config:
  concurrent_packages: 8
  locks: false
  build_jobs: 48
  source_cache: /auto/projects/celeritas/spack-cache/source
  install_tree:
    padded_length: 128
    projections:
      all: "{name}/{version}/{hash:7}"

mirrors::
  spack-public:
    binary: False
    url: https://mirror.spack.io
    
  projects:
    url: /auto/projects/celeritas/spack-cache/build
    binary: true
    signed: false
    autopush: false

concretizer:
  unify: true
  targets:
    granularity: generic
    host_compatible: true

definitions:
  - specs_dev:
      - ccache
      - py-pre-commit
      - cmake
      - ninja
      - git
      - python
  - specs_excl_util:
      - git-lfs
      - gh
      - libtree
      - jq
  - specs_celer:
      - cli11
      - nlohmann-json
      - geant4
      - googletest
      - covfie
      - g4vg
      - hepmc3
      - vecgeom
      - root
  - specs_allpix:
      - boost
      - root
      - eigen
      - pkgconfig
      - geant4
      - hepmc3
      - py-numpy
      - hdf5
      - py-h5py
      - cabana
      
packages:
  all:
    target: [x86_64_v3]
    require:
      - target=x86_64_v3
    prefer:
      - "cxxstd=20" # can't require if cxxstd isn't an option
  hdf5:
    prefer:
      - ~cxx # override cxxstd preference
  # Compilers
  c:
    require:
      - "gcc@13.3.0"
  cxx:
    require:
      - "gcc@13.3.0"
  fortran:
    require:
      - "gcc@13.3.0"
  # CUDA compatible with V100 and newer
  cuda:
    require:
      - "@12.9"
