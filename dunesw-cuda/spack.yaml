# Based on https://github.com/brettviren/phaindia
spack:
  include:
    - include/excl.yaml
    - include/reqs-cuda.yaml
    - include/reqs-celer.yaml
    - include/reqs-fnal-ci.yaml
    - include/prefs-hep-nogui.yaml
    - include/ext-ubunutu24.yaml

  mirrors:
    scratch:
      url: /scratch/celeritas/buildcache
      binary: true
      signed: false
      autopush: false

  view:
    default:
      root: /auto/projects/celeritas/dunesw/view-cuda

  config:
    install_tree:
      root:
        /auto/projects/celeritas/dunesw/opt
        #root: /scratch/celeritas/opt/

  specs:
    - $specs_celer_dev
    - $specs_celer_lib
    - $specs_art
    #- $specs_nu
    - $specs_lar
    - $specs_dune
    - cuda
