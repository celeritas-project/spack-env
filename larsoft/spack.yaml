# Based on https://github.com/brettviren/phaindia
spack:
  include:
    - include/reqs-celer.yaml
    - include/reqs-excl.yaml
    - include/reqs-scratch.yaml
    - include/reqs-fnal.yaml
    - include/reqs-cuda.yaml
    - include/prefs-hep-nogui.yaml
    - include/prefs-excl.yaml
    - include/ext-triplecrown.yaml

  view:
    default:
      root: /scratch/celeritas/view-fnal

  definitions:
    - specs_build:
        - ccache
        - py-pre-commit
        - cmake
        - ninja
        - git-lfs
        - git
        - python
    - specs_celer:
        - cli11
        - nlohmann-json
        - geant4
        - googletest
        - covfie
        - hepmc3
        - root
        - cuda
    - specs_util:
        - gh
        - libtree
        - jq
    - specs_art:
        - art
        - art-root-io
        - canvas
        - canvas-root-io
        - cetlib
        - cetlib-except
        - cetmodules
        - critic
        - fhicl-cpp
        - gallery
        - hep-concurrency
        - messagefacility
    - specs_nu:
        - dk2nudata
        - dk2nugenie
        - geant4
        - nug4
        - nurandom
        - nusimdata
        - nuevdb
    - specs_lar:
        - larana
        - larcore
        - larcorealg
        - larcoreobj
        - lardata
        - lardataalg
        - lardataobj
        #- lareventdisplay
        - larevt
        - larexamples
        - larg4
        #- larrecodnn
        - larsim

  specs:
    - $specs_build
    - $specs_celer
    - larsim
